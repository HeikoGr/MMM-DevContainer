version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # A fresh release waits 3 days: a compromised or broken one is usually pulled by then.
    cooldown:
      default-days: 3
    groups:
      actions:
        update-types: [minor, patch]

  # The Dockerfile lives in docker/, so that is the directory Dependabot has to
  # scan. This only moves the FROM image (node:26-trixie-slim). The versions
  # pinned in ARGs - MagicMirror, Playwright, npm - stay manual; see
  # docs/dependency-maintenance.md.
  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
