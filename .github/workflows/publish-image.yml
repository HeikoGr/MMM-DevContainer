name: Publish Base Image

on:
  push:
    branches:
      - main
    # Everything the Dockerfile COPYs into the image belongs here. With only the
    # Dockerfile listed, a change to the checker script or the entrypoint reached
    # GHCR no earlier than the next weekly build.
    paths:
      - docker/Dockerfile
      - docker/entrypoint.sh
      - docker/ecosystem.config.js
      - docker/scripts/**
      - config.js
      - custom.css
      - .github/workflows/publish-image.yml
  schedule:
    # GitHub Actions cron uses UTC. 09:00 UTC is 11:00 in Germany during DST.
    - cron: '0 9 * * 6'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: heikogr/mmm-devcontainer
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=trixie-slim
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true